<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Where To Watch — Entertainment Finder</title>
<style>
:root{--bg:#08090d;--panel:#11131a;--panel2:#171a23;--text:#f5f7fb;--muted:#9da4b5;--accent:#8b5cf6;--accent2:#ec4899;--line:#242936;--green:#22c55e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#1c1234 0,#08090d 34%),#08090d;color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
header{padding:22px 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.05);backdrop-filter:blur(12px);position:sticky;top:0;background:rgba(8,9,13,.75);z-index:10}
.logo{font-weight:900;font-size:22px;letter-spacing:-.8px}.logo span{color:var(--accent)}
nav{display:flex;gap:18px;color:var(--muted);font-size:14px}nav a{color:inherit;text-decoration:none}
.hero{padding:80px 6% 45px;text-align:center;max-width:1050px;margin:auto}.eyebrow{color:#b99cff;font-size:13px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}
h1{font-size:clamp(42px,7vw,76px);line-height:.98;margin:16px 0;letter-spacing:-3px}
.hero p{color:var(--muted);font-size:17px;max-width:650px;margin:0 auto 28px}
.search{display:flex;max-width:760px;margin:auto;background:#11131a;border:1px solid #303544;border-radius:18px;padding:7px;box-shadow:0 18px 60px rgba(0,0,0,.35)}
.search input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:16px;padding:16px}.search button,.primary{border:0;border-radius:13px;padding:0 23px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;cursor:pointer}
.quick{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:16px}.chip{border:1px solid var(--line);background:#10121a;color:#cbd0dc;border-radius:999px;padding:8px 13px;cursor:pointer;font-size:13px}
main{max-width:1180px;margin:auto;padding:0 6% 80px}.section-title{display:flex;justify-content:space-between;align-items:end;margin:25px 0 14px}.section-title h2{margin:0;font-size:22px}.section-title span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-5px);border-color:#4a3b72}.poster{height:270px;background:linear-gradient(135deg,#25283a,#11131a);display:flex;align-items:center;justify-content:center;color:#737b8d;font-weight:700}.poster img{width:100%;height:100%;object-fit:cover}.card-body{padding:13px}.card-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin-top:6px}.rating{color:#ffd166;font-weight:800}.result{display:none;background:linear-gradient(145deg,#141722,#0d0f15);border:1px solid var(--line);border-radius:24px;padding:22px;margin-top:30px}.result.show{display:block}.back{background:none;border:0;color:#a78bfa;cursor:pointer;margin-bottom:15px}.hero-result{display:grid;grid-template-columns:220px 1fr;gap:25px}.hero-poster{min-height:330px;background:#171a23;border-radius:16px;overflow:hidden}.hero-poster img{width:100%;height:100%;object-fit:cover}.kicker{color:#b99cff;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:1px}.result h2{font-size:38px;margin:7px 0}.facts{display:flex;gap:10px;flex-wrap:wrap;margin:13px 0}.fact{padding:7px 10px;background:#1a1d28;border:1px solid #2a2f3d;border-radius:9px;color:#dbe0eb;font-size:13px}.overview{color:#b5bbc9;line-height:1.65}.providers{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.provider{padding:9px 12px;border-radius:10px;background:#171b25;border:1px solid #303646;font-weight:700}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.box{background:#11131a;border:1px solid var(--line);border-radius:16px;padding:18px}.box h3{margin:0 0 12px}.people{display:flex;gap:12px;overflow:auto}.person{min-width:110px}.avatar{width:80px;height:80px;border-radius:50%;background:#222637;overflow:hidden;margin-bottom:8px}.avatar img{width:100%;height:100%;object-fit:cover}.person b{font-size:13px;display:block}.person small{color:var(--muted)}.empty{text-align:center;padding:40px;color:var(--muted);display:none}
@media(max-width:700px){nav{display:none}.hero{padding-top:55px}.search{flex-direction:column;background:transparent;border:0;box-shadow:none;gap:8px}.search input{background:#11131a;border:1px solid #303544;border-radius:13px}.search button{height:52px}.hero-result{grid-template-columns:1fr}.hero-poster{max-width:240px;margin:auto;height:360px;min-height:0}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo">Where<span>ToWatch</span> ✦</div><nav><a href="#discover">Discover</a><a href="#about">How it works</a></nav></header>
<section class="hero">
<div class="eyebrow">Movies · Series · Reality · OTT</div>
<h1>Find it. Know it.<br><span style="background:linear-gradient(90deg,#a78bfa,#f472b6);-webkit-background-clip:text;color:transparent">Watch it.</span></h1>
<p>Search any movie or show and get its streaming availability, IMDb rating, cast, other work and awards — all in one place.</p>
<div class="search"><input id="search" placeholder="Search a movie, series or reality show…" autocomplete="off"><button onclick="searchTitle()">Search</button></div>
<div class="quick"><button class="chip" onclick="demo('Stranger Things')">Stranger Things</button><button class="chip" onclick="demo('Interstellar')">Interstellar</button><button class="chip" onclick="demo('Wednesday')">Wednesday</button></div>
</section>
<main>
<div id="result" class="result"></div>
<section id="discover"><div class="section-title"><h2>Try the demo</h2><span>Connect TMDB for live data</span></div><div class="grid" id="cards"></div></section>
<div class="empty" id="empty">No result found. Try another title.</div>
</main>
<script>
const demoData={
"stranger things":{title:"Stranger Things",year:"2016–",type:"TV Series",rating:"8.6",poster:"https://image.tmdb.org/t/p/w500/x2LSRK2Cm7MZhjluni1msVJ3wDF.jpg",genres:"Sci-Fi · Mystery · Drama",providers:["Netflix"],overview:"When a young boy vanishes, a small town uncovers a mystery involving secret experiments, terrifying supernatural forces and one strange little girl.",cast:[["Millie Bobby Brown","Eleven"],["Finn Wolfhard","Mike Wheeler"],["David Harbour","Jim Hopper"],["Winona Ryder","Joyce Byers"]],awards:"Multiple major awards & nominations",imdb:"tt4574334"},
"interstellar":{title:"Interstellar",year:"2014",type:"Movie",rating:"8.7",poster:"https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",genres:"Sci-Fi · Drama · Adventure",providers:["Check live availability"],overview:"Explorers travel through a wormhole in space in an attempt to ensure humanity's survival.",cast:[["Matthew McConaughey","Cooper"],["Anne Hathaway","Brand"],["Jessica Chastain","Murph"],["Michael Caine","Professor Brand"]],awards:"Academy Award winner + major nominations",imdb:"tt0816692"},
"wednesday":{title:"Wednesday",year:"2022–",type:"TV Series",rating:"8.0",poster:"https://image.tmdb.org/t/p/w500/9PFonBhy4cQy7Jz20NpMygczOkv.jpg",genres:"Comedy · Mystery · Fantasy",providers:["Netflix"],overview:"Wednesday Addams navigates school, friendship and a murder mystery while embracing her unusual talents.",cast:[["Jenna Ortega","Wednesday Addams"],["Catherine Zeta-Jones","Morticia"],["Luis Guzmán","Gomez"],["Emma Myers","Enid"]],awards:"Major awards nominations",imdb:"tt13443470"}
};
function demo(q){document.getElementById('search').value=q;searchTitle()}
function searchTitle(){
 const q=document.getElementById('search').value.trim().toLowerCase();
 const d=demoData[q] || Object.values(demoData).find(x=>x.title.toLowerCase().includes(q));
 if(!d){document.getElementById('result').className='result';document.getElementById('empty').style.display='block';return}
 document.getElementById('empty').style.display='none';
 const r=document.getElementById('result');r.className='result show';
 r.innerHTML=`<button class="back" onclick="document.getElementById('result').className='result'">← Back</button>
 <div class="hero-result"><div class="hero-poster"><img src="${d.poster}" alt="${d.title}"></div><div>
 <div class="kicker">${d.type}</div><h2>${d.title}</h2><div class="facts"><span class="fact">${d.year}</span><span class="fact">${d.genres}</span><span class="fact">⭐ IMDb ${d.rating}</span></div>
 <p class="overview">${d.overview}</p><h3>Where can I watch it?</h3><div class="providers">${d.providers.map(p=>`<span class="provider">▶ ${p}</span>`).join('')}</div>
 <div style="margin-top:18px"><a href="https://www.imdb.com/title/${d.imdb}/" target="_blank" class="primary" style="display:inline-block;padding:12px 16px;text-decoration:none">Open IMDb ↗</a></div>
 </div></div>
 <div class="two"><div class="box"><h3>🎭 Main Cast</h3><div class="people">${d.cast.map(c=>`<div class="person"><div class="avatar"></div><b>${c[0]}</b><small>${c[1]}</small></div>`).join('')}</div></div>
 <div class="box"><h3>🏆 Awards</h3><p style="color:#b5bbc9">${d.awards}</p><p style="color:#8f96a6;font-size:12px">Live award details can be connected to an external data source in the production version.</p></div></div>`;
}
function card(d){return `<div class="card" onclick="demo('${d.title}')"><div class="poster"><img src="${d.poster}" alt=""></div><div class="card-body"><div class="card-title">${d.title}</div><div class="meta">${d.year} · <span class="rating">★ ${d.rating}</span></div></div></div>`}
document.getElementById('cards').innerHTML=Object.values(demoData).map(card).join('');
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')searchTitle()});
</script>
</body></html>
